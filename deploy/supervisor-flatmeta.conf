; Keeps the real-time server running and restarts it if it stops.
[program:flatmeta-websocket]
command=/usr/bin/php /var/www/flatmetaAPI/artisan websocket:serve --host=127.0.0.1 --port=3500
directory=/var/www/flatmetaAPI
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/www/flatmetaAPI/storage/logs/websocket.log
redirect_stderr=true
