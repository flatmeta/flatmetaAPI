# API + real-time server. TLS certificates from certbot (Let's Encrypt).
server {
    listen 80;
    server_name api.flatmeta.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.flatmeta.io;

    ssl_certificate     /etc/letsencrypt/live/api.flatmeta.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.flatmeta.io/privkey.pem;

    root /var/www/flatmetaAPI/public;
    index index.php;
    client_max_body_size 25m;   # uploads: images 5 MB, video 20 MB

    # Live avatars & chat: wss://api.flatmeta.io/ws -> php artisan websocket:serve on 127.0.0.1:3500
    location /ws {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    # Uploaded files are served as plain files, never executed.
    location ~* ^/assets/uploads/.*\.(php|phtml|phar)$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
