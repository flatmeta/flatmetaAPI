# The web app (Ionic/Angular build output from `npx ng build`, the www/ folder).
server {
    listen 80;
    server_name flatmeta.io www.flatmeta.io;
    return 301 https://flatmeta.io$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.flatmeta.io;
    ssl_certificate     /etc/letsencrypt/live/flatmeta.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flatmeta.io/privkey.pem;
    return 301 https://flatmeta.io$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flatmeta.io;
    ssl_certificate     /etc/letsencrypt/live/flatmeta.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flatmeta.io/privkey.pem;

    root /var/www/flatmeta.io/www;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files can be cached for a year; index.html never.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /ngsw.json { add_header Cache-Control "no-cache"; }

    # Every map link (/u/name, /at/..., /home, /thankyou...) is handled by the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
